<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie suas perguntas</title>
</head>
<body>
    <h1>Crie suas perguntas</h1>

    <p>Crie a sua pergunta de texto</p>

    <form id="formulario">

        <p>ID:</p>
        <input type="number" id="id" required>

        <p>Pergunta:</p>
        <input type="text" id="pergunta" required>

        <p>Resposta:</p>
        <input type="text" id="resposta" required>

        <br><br>

        <button type="button" onclick="enviarPergunta()">Criar pergunta de texto</button>

    </form>

    <p id="resultado"></p>

    <br>

    <a href="criar_perguntas_multipla_escolha.html">Criar pergunta de múltipla escolha</a>

    <br><br>

    <a href="alterar_texto.html">Altere sua pergunta dissertativa</a>

    <br><br>

    <a href="listar_perguntas.html">Veja suas perguntas</a>

    <br><br>

    <a href="listar_uma_pergunta.html">Veja uma pergunta específica</a>

    <br><br>

    <a href="excluir_texto.html">Excluir pergunta de texto</a>

    <script>
        function enviarPergunta() {
            let id = document.getElementById("id").value;
            let pergunta = document.getElementById("pergunta").value;
            let respostaTexto = document.getElementById("resposta").value;
            let xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    let resposta = JSON.parse(xhr.responseText);
                    document.getElementById("resultado").textContent = resposta.mensagem;
                    if (resposta.mensagem == "Pergunta criada com sucesso!!!") {
                        alert(resposta.mensagem);
                        location.reload();
                    }
                }
            };
            let dados = "id=" + encodeURIComponent(id) +
                        "&pergunta=" + encodeURIComponent(pergunta) +
                        "&resposta=" + encodeURIComponent(respostaTexto);
            xhr.open("POST", "perguntas_texto.php", true);
            xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            xhr.send(dados);
        }
    </script>
</body>
</html>
